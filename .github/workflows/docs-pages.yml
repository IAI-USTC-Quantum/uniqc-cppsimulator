name: Docs (GitHub Pages)

# Build the Sphinx site and publish it to GitHub Pages on every push to main
# that can change its content, plus manual runs.
# First run: enable Pages in repo Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: [ "main" ]
    paths:
      - 'docs/**'
      - 'doc/**'
      - 'benchmark/**'
      - 'UniqcCpp/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'pyproject.toml'
      - 'setup.py'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push supersedes the in-flight one.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      with:
        fetch-depth: 0  # full history for setuptools_scm version in the docs

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
      with:
        python-version: '3.12'

    - name: Configure GitHub Pages
      id: pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

    - name: Install docs dependencies
      run: python -m pip install -r docs/requirements.txt

    # autodoc imports the benchmark/ package (via sys.path in docs/conf.py)
    # and the uniqc_cpp extension, so install the extension from source.
    - name: Build and install the extension
      run: python -m pip install .

    - name: Copy markdown sources into the Sphinx tree
      run: python docs/prepare.py

    - name: Build HTML (warnings are errors)
      run: python -m sphinx -W --keep-going -b html docs docs/_build/html

    - name: Upload pages artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
      with:
        path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
